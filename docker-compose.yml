services:
  pz-dashboard:
    build: .
    volumes:
      - ~/backups/firestore:/backups
      - ~/.secrets:/secrets
      - ~/agents_map:/app/app/static/agents_map
      - ./data:/app/app/instance
    environment:
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=?personalzucchero2026personalzucchero!
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - backend
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Monta la configurazione di Nginx in sola lettura
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Opzionale: monta il volume dei file statici se vuoi che Nginx li serva direttamente
      - ./app/static:/usr/share/nginx/html/static:ro
      - ~/agents_map:/usr/share/nginx/html/agents_map:ro
    depends_on:
      - pz-dashboard
    restart: unless-stopped
    networks:
      - backend
  
  sqlite-web:
    image: coleifer/sqlite-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/app/instance
    command: sqlite_web -H 0.0.0.0 /app/app/instance/database.db
    environment:
      - SQLITE_WEB_PASSWORD=tactile

networks:
  backend:
    name: shared_backend

volumes:
  redis_data: