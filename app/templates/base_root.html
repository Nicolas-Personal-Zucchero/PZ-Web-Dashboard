<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Personal Zucchero{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Effetto hover generico per tutti i pulsanti */
        .btn {
            transition: all 0.2s ease;
            /* animazione fluida */
        }

        .btn:hover {
            transform: translateY(-2px);
            /* leggero sollevamento */
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
            /* ombra */
            filter: brightness(1.15);
            /* schiarisce leggermente il colore */
        }

        /* Tabelle */

        .list-group.styled-table .static-header {
            background-color: #f8f9fa;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .list-group.styled-table li.list-group-item:nth-child(odd):not(.static-header) {
            background-color: #f8f9fa;
            /* righe alternate */
        }

        .list-group.styled-table li.list-group-item:nth-child(even):not(.static-header) {
            background-color: #ffffff;
        }

        .list-group.styled-table li.list-group-item:not(.static-header):hover {
            background-color: #e9ecef;
        }


        /* Effetto hover per le card homepage*/
        .hover-card {
            transition: transform 0.2s ease-in-out, border-color 0.2s ease-in-out;
            border: 1px solid #ddd;
        }

        .hover-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #4393C8;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .card-title {
            color: #333;
        }

        .card-text {
            color: #555;
        }
    </style>

    {% block styles %}{% endblock %}
</head>

<body>
    {% block layout %}{% endblock %}
</body>

</html>
